<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Kart Racing</title>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: #75bde8;
}

canvas {
    display: block;
}

#hud {
    position: fixed;
    top: 18px;
    left: 18px;
    z-index: 10;
    color: white;
    background: rgba(0,0,0,.6);
    padding: 15px 20px;
    border-radius: 14px;
    font-size: 18px;
    line-height: 1.6;
}

#boost {
    width: 180px;
    height: 12px;
    background: #333;
    border-radius: 10px;
    overflow: hidden;
    margin-top: 5px;
}

#boostBar {
    width: 100%;
    height: 100%;
    background: orange;
}

#help {
    position: fixed;
    bottom: 18px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    color: white;
    background: rgba(0,0,0,.6);
    padding: 10px 18px;
    border-radius: 12px;
    text-align: center;
}

#message {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%,-50%);
    z-index: 20;
    color: white;
    font-size: 55px;
    font-weight: bold;
    text-shadow: 3px 3px 10px black;
    pointer-events: none;
}
</style>
</head>

<body>

<div id="hud">
    🏎️ Speed: <span id="speed">0</span> km/h<br>
    🏁 Lap: <span id="lap">1</span> / 3<br>
    🏆 Position: <span id="position">1</span> / 4

    <div>💨 Boost</div>
    <div id="boost">
        <div id="boostBar"></div>
    </div>
</div>

<div id="help">
    W / ↑ = Accelerate |
    S / ↓ = Brake |
    A / ← = Left |
    D / → = Right |
    SPACE = Drift |
    SHIFT = Boost
</div>

<div id="message"></div>

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";


/* =====================================================
   SCENE
===================================================== */

const scene = new THREE.Scene();

scene.background =
    new THREE.Color(0x78c7ed);

scene.fog =
    new THREE.Fog(
        0x78c7ed,
        100,
        500
    );


/* =====================================================
   CAMERA
===================================================== */

const camera =
    new THREE.PerspectiveCamera(
        65,
        innerWidth / innerHeight,
        .1,
        1000
    );

camera.position.set(
    0,
    6,
    -10
);


/* =====================================================
   RENDERER
===================================================== */

const renderer =
    new THREE.WebGLRenderer({
        antialias: true
    });

renderer.setSize(
    innerWidth,
    innerHeight
);

renderer.setPixelRatio(
    Math.min(
        devicePixelRatio,
        2
    )
);

renderer.shadowMap.enabled = true;

renderer.shadowMap.type =
    THREE.PCFSoftShadowMap;

document.body.appendChild(
    renderer.domElement
);


/* =====================================================
   LIGHTING
===================================================== */

const sun =
    new THREE.DirectionalLight(
        0xffffff,
        3
    );

sun.position.set(
    100,
    150,
    80
);

sun.castShadow = true;

sun.shadow.mapSize.width =
    2048;

sun.shadow.mapSize.height =
    2048;

sun.shadow.camera.left = -200;
sun.shadow.camera.right = 200;
sun.shadow.camera.top = 200;
sun.shadow.camera.bottom = -200;

scene.add(sun);


const ambient =
    new THREE.HemisphereLight(
        0xbbeaff,
        0x355522,
        1.5
    );

scene.add(ambient);


/* =====================================================
   GROUND
===================================================== */

const ground =
    new THREE.Mesh(
        new THREE.PlaneGeometry(
            1000,
            1000
        ),
        new THREE.MeshStandardMaterial({
            color: 0x39823a,
            roughness: 1
        })
    );

ground.rotation.x =
    -Math.PI / 2;

ground.receiveShadow = true;

scene.add(ground);


/* =====================================================
   TRACK
===================================================== */

const trackPoints = [];

const RX = 90;
const RZ = 60;

const TRACK_POINTS = 160;

for (
    let i = 0;
    i < TRACK_POINTS;
    i++
) {

    const a =
        i /
        TRACK_POINTS *
        Math.PI *
        2;

    trackPoints.push(
        new THREE.Vector3(
            Math.cos(a) * RX,
            0,
            Math.sin(a) * RZ
        )
    );
}


/* =====================================================
   ROAD
===================================================== */

const roadMaterial =
    new THREE.MeshStandardMaterial({
        color: 0x414141,
        roughness: .95
    });

for (
    let i = 0;
    i < TRACK_POINTS;
    i++
) {

    const a =
        trackPoints[i];

    const b =
        trackPoints[
            (i + 1) %
            TRACK_POINTS
        ];

    const mid =
        new THREE.Vector3()
            .addVectors(a,b)
            .multiplyScalar(.5);

    const length =
        a.distanceTo(b);

    const road =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                14,
                .25,
                length + .5
            ),
            roadMaterial
        );

    road.position.copy(mid);

    road.position.y =
        .05;

    road.lookAt(
        b.x,
        .05,
        b.z
    );

    road.receiveShadow = true;

    scene.add(road);
}


/* =====================================================
   ROAD CENTER MARKINGS
===================================================== */

const whiteMaterial =
    new THREE.MeshStandardMaterial({
        color: 0xffffff
    });

for (
    let i = 0;
    i < TRACK_POINTS;
    i += 5
) {

    const p =
        trackPoints[i];

    const marker =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                .35,
                .08,
                3
            ),
            whiteMaterial
        );

    marker.position.copy(p);

    marker.position.y =
        .23;

    marker.lookAt(
        trackPoints[
            (i + 1) %
            TRACK_POINTS
        ]
    );

    scene.add(marker);
}


/* =====================================================
   CURB BLOCKS
===================================================== */

function addCurb(x,z,rotation) {

    const curb =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                1.2,
                .3,
                2.2
            ),
            new THREE.MeshStandardMaterial({
                color:
                    Math.random() > .5
                    ? 0xffffff
                    : 0xe53935
            })
        );

    curb.position.set(
        x,
        .2,
        z
    );

    curb.rotation.y =
        rotation;

    curb.castShadow = true;

    scene.add(curb);
}

for (
    let i = 0;
    i < TRACK_POINTS;
    i += 2
) {

    const p =
        trackPoints[i];

    const angle =
        Math.atan2(
            p.z / RZ,
            p.x / RX
        );

    const outer =
        new THREE.Vector3(
            Math.cos(angle) * 97,
            0,
            Math.sin(angle) * 67
        );

    addCurb(
        outer.x,
        outer.z,
        -angle
    );
}


/* =====================================================
   TREES
===================================================== */

function createTree(x,z) {

    const tree =
        new THREE.Group();


    const trunk =
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                .35,
                .5,
                3,
                8
            ),
            new THREE.MeshStandardMaterial({
                color: 0x704214
            })
        );

    trunk.position.y =
        1.5;

    trunk.castShadow = true;

    tree.add(trunk);


    const leaves =
        new THREE.Mesh(
            new THREE.ConeGeometry(
                2.7,
                6,
                10
            ),
            new THREE.MeshStandardMaterial({
                color: 0x176b2c
            })
        );

    leaves.position.y =
        5;

    leaves.castShadow = true;

    tree.add(leaves);


    tree.position.set(
        x,
        0,
        z
    );

    scene.add(tree);
}


for (
    let i = 0;
    i < 120;
    i++
) {

    const angle =
        Math.random() *
        Math.PI *
        2;

    const radius =
        105 +
        Math.random() * 100;

    createTree(
        Math.cos(angle) * radius,
        Math.sin(angle) * radius
    );
}


/* =====================================================
   HUMAN DRIVER
===================================================== */

function createDriver() {

    const driver =
        new THREE.Group();


    /* body */

    const body =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                1.25,
                1.4,
                .7
            ),
            new THREE.MeshStandardMaterial({
                color: 0x1976d2
            })
        );

    body.position.y =
        1.45;

    body.castShadow = true;

    driver.add(body);


    /* head */

    const head =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                .48,
                20,
                20
            ),
            new THREE.MeshStandardMaterial({
                color: 0xf1b27a
            })
        );

    head.position.y =
        2.45;

    head.castShadow = true;

    driver.add(head);


    /* helmet */

    const helmet =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                .53,
                20,
                20
            ),
            new THREE.MeshStandardMaterial({
                color: 0xff1744
            })
        );

    helmet.scale.y =
        .55;

    helmet.position.y =
        2.67;

    helmet.castShadow = true;

    driver.add(helmet);


    /* arms */

    const armMaterial =
        new THREE.MeshStandardMaterial({
            color: 0x1976d2
        });

    const armGeometry =
        new THREE.CylinderGeometry(
            .12,
            .12,
            1.1,
            10
        );


    const leftArm =
        new THREE.Mesh(
            armGeometry,
            armMaterial
        );

    leftArm.rotation.z =
        -.8;

    leftArm.rotation.x =
        -.8;

    leftArm.position.set(
        -.55,
        1.55,
        .65
    );

    driver.add(leftArm);


    const rightArm =
        new THREE.Mesh(
            armGeometry,
            armMaterial
        );

    rightArm.rotation.z =
        .8;

    rightArm.rotation.x =
        -.8;

    rightArm.position.set(
        .55,
        1.55,
        .65
    );

    driver.add(rightArm);


    return driver;
}


/* =====================================================
   KART
===================================================== */

function createKart(color) {

    const kart =
        new THREE.Group();


    /* body */

    const body =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                2.4,
                .65,
                4
            ),
            new THREE.MeshStandardMaterial({
                color: color,
                metalness: .15,
                roughness: .4
            })
        );

    body.position.y =
        .75;

    body.castShadow = true;

    kart.add(body);


    /* front nose */

    const nose =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                1.8,
                .35,
                1.1
            ),
            new THREE.MeshStandardMaterial({
                color: color
            })
        );

    nose.position.set(
        0,
        .85,
        1.9
    );

    nose.castShadow = true;

    kart.add(nose);


    /* seat */

    const seat =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                1.3,
                .45,
                1.2
            ),
            new THREE.MeshStandardMaterial({
                color: 0x171717
            })
        );

    seat.position.set(
        0,
        1.05,
        -.5
    );

    kart.add(seat);


    /* steering wheel */

    const wheel =
        new THREE.Mesh(
            new THREE.TorusGeometry(
                .35,
                .07,
                10,
                24
            ),
            new THREE.MeshStandardMaterial({
                color: 0x151515
            })
        );

    wheel.rotation.x =
        Math.PI / 2;

    wheel.position.set(
        0,
        1.5,
        .8
    );

    kart.add(wheel);


    /* wheels */

    const wheelGeometry =
        new THREE.CylinderGeometry(
            .48,
            .48,
            .38,
            20
        );

    const wheelMaterial =
        new THREE.MeshStandardMaterial({
            color: 0x101010
        });


    const wheelPositions = [
        [-1.15,.5,1.3],
        [1.15,.5,1.3],
        [-1.15,.5,-1.3],
        [1.15,.5,-1.3]
    ];


    for (
        const pos of wheelPositions
    ) {

        const wheel =
            new THREE.Mesh(
                wheelGeometry,
                wheelMaterial
            );

        wheel.rotation.z =
            Math.PI / 2;

        wheel.position.set(
            pos[0],
            pos[1],
            pos[2]
        );

        wheel.castShadow = true;

        kart.add(wheel);
    }


    /* driver */

    const driver =
        createDriver();

    kart.add(driver);


    /* headlights */

    const lightMaterial =
        new THREE.MeshStandardMaterial({
            color: 0xffffcc,
            emissive: 0xffffaa,
            emissiveIntensity: 3
        });


    for (
        const x of [-.65,.65]
    ) {

        const light =
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    .3,
                    .2,
                    .1
                ),
                lightMaterial
            );

        light.position.set(
            x,
            .85,
            2.45
        );

        kart.add(light);
    }


    return kart;
}


/* =====================================================
   PLAYER
===================================================== */

const player =
    createKart(
        0xe53935
    );

scene.add(player);


/* Start position */

const start =
    trackPoints[0];

player.position.set(
    start.x,
    0,
    start.z
);

player.rotation.y =
    Math.atan2(
        trackPoints[1].x -
        start.x,
        trackPoints[1].z -
        start.z
);


/* =====================================================
   AI
===================================================== */

const aiCars = [];

const aiColors = [
    0x2196f3,
    0xffd600,
    0x9c27b0
];


for (
    let i = 0;
    i < 3;
    i++
) {

    const car =
        createKart(
            aiColors[i]
        );

    scene.add(car);

    aiCars.push({
        mesh: car,
        index:
            20 +
            i * 45,
        speed:
            .32 +
            Math.random() * .08
    });
}


/* =====================================================
   CONTROLS
===================================================== */

const keys = {};

addEventListener(
    "keydown",
    e => {

        keys[
            e.key.toLowerCase()
        ] = true;

        if (
            e.key === " "
        ) {
            e.preventDefault();
        }
    }
);

addEventListener(
    "keyup",
    e => {

        keys[
            e.key.toLowerCase()
        ] = false;
    }
);


/* =====================================================
   GAME VARIABLES
===================================================== */

let speed = 0;

let boost = 100;

let lap = 1;

let playerTrackIndex = 0;

let raceFinished = false;


/* =====================================================
   PLAYER UPDATE
===================================================== */

function updatePlayer() {

    if (raceFinished)
        return;


    const accelerate =
        keys["w"] ||
        keys["arrowup"];

    const brake =
        keys["s"] ||
        keys["arrowdown"];

    const drifting =
        keys[" "];


    /* acceleration */

    if (accelerate) {

        speed += .012;

    } else {

        speed -= .003;
    }


    /* brake */

    if (brake) {

        speed -= .025;
    }


    /* BOOST */

    if (
        keys["shift"] &&
        boost > 0 &&
        speed > .15
    ) {

        speed += .025;

        boost -= .7;

    } else {

        boost += .08;
    }


    boost =
        THREE.MathUtils.clamp(
            boost,
            0,
            100
        );


    /* drift */

    if (drifting) {

        speed *= .998;

    }


    speed =
        THREE.MathUtils.clamp(
            speed,
            0,
            .85
        );


    /* steering */

    let steer = 0;

    if (
        keys["a"] ||
        keys["arrowleft"]
    ) {
        steer = 1;
    }

    if (
        keys["d"] ||
        keys["arrowright"]
    ) {
        steer = -1;
    }


    player.rotation.y +=
        steer *
        speed *
        (
            drifting
            ? .12
            : .07
        );


    /* movement */

    const direction =
        new THREE.Vector3(
            0,
            0,
            1
        );

    direction.applyQuaternion(
        player.quaternion
    );

    player.position.addScaledVector(
        direction,
        speed
    );


    /* find nearest track point */

    let closest = 0;

    let closestDistance =
        Infinity;

    for (
        let i = 0;
        i < TRACK_POINTS;
        i++
    ) {

        const d =
            player.position.distanceTo(
                trackPoints[i]
            );

        if (
            d <
            closestDistance
        ) {

            closestDistance = d;

            closest = i;
        }
    }


    playerTrackIndex =
        closest;


    /* keep player on track */

    if (
        closestDistance > 9
    ) {

        const target =
            trackPoints[
                closest
            ];

        player.position.lerp(
            target,
            .03
        );

        speed *= .96;
    }


    /* lap detection */

    if (
        playerTrackIndex <
        5 &&
        speed > .1
    ) {

        if (
            player.userData.lastIndex >
            TRACK_POINTS * .7
        ) {

            lap++;

            if (lap > 3) {

                lap = 3;

                finishRace();
            }
        }
    }


    player.userData.lastIndex =
        playerTrackIndex;
}


/* =====================================================
   AI UPDATE
===================================================== */

function updateAI() {

    for (
        const ai of aiCars
    ) {

        ai.index +=
            ai.speed;

        if (
            ai.index >=
            TRACK_POINTS
        ) {

            ai.index -=
                TRACK_POINTS;
        }


        const i =
            Math.floor(
                ai.index
            );

        const p =
            trackPoints[i];

        const next =
            trackPoints[
                (i + 1) %
                TRACK_POINTS
            ];


        ai.mesh.position.set(
            p.x,
            0,
            p.z
        );


        ai.mesh.rotation.y =
            Math.atan2(
                next.x - p.x,
                next.z - p.z
            );
    }
}


/* =====================================================
   POSITION
===================================================== */

function getPosition() {

    let position = 1;

    for (
        const ai of aiCars
    ) {

        const aiIndex =
            Math.floor(
                ai.index
            );

        let playerProgress =
            playerTrackIndex;

        let aiProgress =
            aiIndex;


        if (
            aiProgress >
            playerProgress
        ) {
            position++;
        }
    }

    return position;
}


/* =====================================================
   CAMERA
===================================================== */

function updateCamera() {

    const offset =
        new THREE.Vector3(
            0,
            5.5,
            -10
        );

    offset.applyQuaternion(
        player.quaternion
    );


    const target =
        player.position
            .clone()
            .add(offset);


    camera.position.lerp(
        target,
        .09
    );


    const look =
        player.position
            .clone();


    look.y += 1.3;


    camera.lookAt(
        look
    );
}


/* =====================================================
   FINISH
===================================================== */

function finishRace() {

    raceFinished = true;

    document.getElementById(
        "message"
    ).textContent =
        "🏁 FINISH!";

    setTimeout(
        () => {

            document.getElementById(
                "message"
            ).textContent =
                "Press R to race again";

        },
        2000
    );
}


/* =====================================================
   RESTART
===================================================== */

addEventListener(
    "keydown",
    e => {

        if (
            e.key.toLowerCase() === "r"
        ) {

            location.reload();
        }
    }
);


/* =====================================================
   HUD
===================================================== */

function updateHUD() {

    document.getElementById(
        "speed"
    ).textContent =
        Math.round(
            speed * 420
        );


    document.getElementById(
        "lap"
    ).textContent =
        lap;


    document.getElementById(
        "position"
    ).textContent =
        getPosition();


    document.getElementById(
        "boostBar"
    ).style.width =
        boost + "%";
}


/* =====================================================
   ANIMATION
===================================================== */

function animate() {

    requestAnimationFrame(
        animate
    );


    updatePlayer();

    updateAI();

    updateCamera();

    updateHUD();


    renderer.render(
        scene,
        camera
    );
}


animate();


/* =====================================================
   RESIZE
===================================================== */

addEventListener(
    "resize",
    () => {

        camera.aspect =
            innerWidth /
            innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );
    }
);

</script>

</body>
</html>
